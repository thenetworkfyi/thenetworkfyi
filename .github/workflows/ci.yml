name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Unit & contract tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: uv run --extra dev ruff check .

      - name: Check formatting
        run: uv run --extra dev ruff format --check .

      - name: Validate OpenTelemetry Collector config
        run: |
          docker run --rm \
            -v "$PWD/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml" \
            -v /:/hostfs:ro \
            -e POSTGRES_MONITOR_USER=validate \
            -e POSTGRES_MONITOR_PASSWORD=validate \
            -e POSTGRES_DB=validate \
            otel/opentelemetry-collector-contrib:0.118.0 \
            validate --config=/etc/otelcol-contrib/config.yaml

      - name: Run non-integration tests
        run: uv run pytest -m "not integration" --tb=short -q

  build:
    name: Build and push image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  # There is deliberately no deploy job. The host pulls: thenetwork-deploy.timer
  # runs scripts/deploy-poll.sh every minute, which fast-forwards the checkout
  # and pulls a new worker image when one appears. CI therefore holds no
  # credential for the production host, so a malicious commit has no deployment
  # secret to steal. See docs/development.md.

  cleanup-images:
    name: Retain recent worker images
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Retain the three newest GHCR versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 3
