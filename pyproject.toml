[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thenetwork-agent"
version = "0.1.0"
description = "An email-driven agentic connection engine"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.21",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-ai>=2.6.0",
    "pydantic-settings>=2.5",
    "imap-tools>=1.7",
    "beautifulsoup4>=4.12",
    "llama-index-core>=0.11",
    "llama-index-embeddings-openai>=0.2",
    "networkx>=3.3",
    "procrastinate[sqlalchemy]>=2.9",
    "limits>=3.13",
    "python-gnupg>=0.5",
    "structlog>=24.1",
    "opentelemetry-sdk>=1.42,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.42,<2",
    "transformers>=4.60",
    "jinja2>=3.1",
    "python-disposable>=0.0.13",
    "llamafirewall==1.0.3",
    "huggingface-hub>=0.23",
    "torch==2.12.0",
]

[project.optional-dependencies]
# The simulation harness only. `thenetwork.sim` (the `sim` console script) is the
# sole importer of all three. Moving CrewAI and pydantic-evals here keeps them out
# of the deployed image entirely - CrewAI in particular drags LiteLLM into whatever
# installs it, and the runtime uses pydantic-ai directly. `tenacity` is
# listed for accurate provenance rather than image size: llama-index-core and
# pydantic-ai already pull it transitively either way.
sim = [
    "crewai>=0.80.0",
    "pydantic-evals>=0.0.14",
    "tenacity>=9.0",
]
dev = [
    "thenetwork-agent[sim]",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
    "testcontainers[postgres]>=4.0",
    "aiosmtpd>=1.4.6",
    "trustme>=1.1",
]

[project.scripts]
thenetwork-worker = "thenetwork.worker.tasks:main"
thenetwork-producer = "thenetwork.worker.tasks:producer_main"
sim = "thenetwork.sim.cli:main"

[project.urls]
Homepage = "https://github.com/thenetworkfyi/agent"
Repository = "https://github.com/thenetworkfyi/agent"
Documentation = "https://github.com/thenetworkfyi/agent#readme"
Issues = "https://github.com/thenetworkfyi/agent/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["thenetwork*"]

[tool.setuptools.package-data]
"thenetwork.email" = ["templates/*.html", "templates/fixed/*.html", "templates/fixed/*.txt"]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a live pgvector DB (deselect with '-m not integration')",
    "live_model: marks tests that call the real configured AGENT_MODEL (also marked integration, so '-m not integration' already excludes them; select explicitly with '-m live_model')",
    "real_sanitizer: marks tests that require the local privacy-filter model weights",
]
