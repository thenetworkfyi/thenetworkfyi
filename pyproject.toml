[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thenetwork-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.21",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-ai[openai,anthropic]>=0.0.14",
    "pydantic-settings>=2.5",
    "imap-tools>=1.7",
    "llama-index>=0.11",
    "llama-index-vector-stores-postgres>=0.2",
    "llama-index-embeddings-openai>=0.2",
    "networkx>=3.3",
    "procrastinate[sqlalchemy]>=2.9",
    "limits[storage]>=3.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pydantic-evals>=0.0.14",
]

[project.optional-dependencies]
content-scan = [
    "llm-guard>=0.3",
]
# Presidio (Microsoft, a mainstream/well-adopted NER-based PII library, per
# the "use established libraries, don't reinvent" principle in
# docs/design-decisions.md) strengthens the deterministic sanitizer with
# person/org/location redaction beyond the email/phone regexes. Optional
# because the spacy model download needs network access some deploy
# environments lack; thenetwork/memory/sanitize.py falls back to the
# regex-only strip when this extra (or its model) isn't available.
pii-ner = [
    "presidio-analyzer>=2.2",
    "spacy>=3.7",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pydantic-evals>=0.0.14",
]

[project.scripts]
thenetwork-worker = "thenetwork.worker.tasks:main"
thenetwork-producer = "thenetwork.worker.tasks:producer_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["thenetwork*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a live pgvector DB (deselect with '-m not integration')",
    "live_model: marks tests that call the real configured AGENT_MODEL (also marked integration, so '-m not integration' already excludes them; select explicitly with '-m live_model')",
]
