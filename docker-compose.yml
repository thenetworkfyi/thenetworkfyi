services:
  db:
    image: pgvector/pgvector:pg17
    env_file: .env
    environment:
      POSTGRES_DB: network_db
      POSTGRES_USER: ${POSTGRES_USER:-network}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-network} -d network_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
