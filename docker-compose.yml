services:
  db:
    image: pgvector/pgvector:pg17
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Bind to loopback only: nothing outside the host (or the compose network)
    # should reach Postgres. The worker talks to it over the internal network.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-network} -d network_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    # `docker compose build` builds this locally; `docker compose pull` fetches
    # the published image in production. Set IMAGE to your GHCR path, e.g.
    # IMAGE=ghcr.io/<owner>/thenetwork-agent:latest
    image: ${IMAGE:-thenetwork-agent:latest}
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Parts, not a pre-built DATABASE_URL: the app assembles (and correctly
      # percent-encodes) the connection URI itself, so POSTGRES_PASSWORD here
      # can be the literal password Postgres was initialized with, no manual
      # URL-encoding required in .env.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: network_db
      POSTGRES_USER: ${POSTGRES_USER:-network}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # LlamaFirewall stores its downloaded Prompt Guard model here. The named
      # volume makes startup preload a one-time download when scanning is on.
      HF_HOME: /home/appuser/.cache/huggingface
      WORKER_METRICS_OTLP_ENDPOINT: ${WORKER_METRICS_OTLP_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      WORKER_METRICS_EXPORT_INTERVAL_SECONDS: ${WORKER_METRICS_EXPORT_INTERVAL_SECONDS:-30}
      WORKER_METRICS_EXPORT_TIMEOUT_SECONDS: ${WORKER_METRICS_EXPORT_TIMEOUT_SECONDS:-5}
      WORKER_METRICS_COLLECTION_TIMEOUT_SECONDS: ${WORKER_METRICS_COLLECTION_TIMEOUT_SECONDS:-2}
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        mode: non-blocking
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    # Let in-flight agent runs finish on redeploy/stop before SIGKILL.
    # Procrastinate drains gracefully on SIGTERM; size this to your slowest job.
    stop_grace_period: 300s
    restart: unless-stopped
    volumes:
      - hf-cache:/home/appuser/.cache/huggingface

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-false}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:24224:24224"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.5
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alert-rules.yml:/etc/prometheus/rules/thenetwork.yml:ro
      - prometheus-data:/prometheus
    # The UI is for local operator access only. Prometheus reaches collector
    # metric endpoints over the internal Compose network.
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      otel-collector:
        condition: service_started
      alertmanager:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.32.1
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=0.0.0.0:9093"
      - "--cluster.listen-address="
      - "--enable-feature=utf8-strict-mode"
    configs:
      - source: alertmanager-config
        target: /etc/alertmanager/alertmanager.yml
    volumes:
      - alertmanager-data:/alertmanager
    # Alertmanager is reachable by Prometheus on the internal Compose network.
    # Its operator UI is not exposed beyond the local host.
    ports:
      - "127.0.0.1:9093:9093"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  pgdata:
  hf-cache:
  prometheus-data:
  alertmanager-data:

configs:
  alertmanager-config:
    # Compose interpolation supplies deployment-specific addressing without
    # committing an operator address or SMTP credential.
    content: |
      global:
        resolve_timeout: 5m
        smtp_smarthost: "${ALERTMANAGER_SMTP_SMARTHOST:-}"
        smtp_from: "${ALERTMANAGER_SMTP_FROM:-}"
        smtp_auth_username: "${ALERTMANAGER_SMTP_USERNAME:-}"
        smtp_auth_password: "${ALERTMANAGER_SMTP_PASSWORD:-}"
        smtp_require_tls: ${ALERTMANAGER_SMTP_REQUIRE_TLS:-true}

      route:
        receiver: operator-email
        group_by: [alertname, severity, category]
        group_wait: ${ALERTMANAGER_GROUP_WAIT:-30s}
        group_interval: ${ALERTMANAGER_GROUP_INTERVAL:-5m}
        repeat_interval: ${ALERTMANAGER_WARNING_REPEAT_INTERVAL:-12h}
        routes:
          - receiver: operator-email
            matchers: ['category="event"']
            group_wait: 0s
            group_interval: ${ALERTMANAGER_EVENT_GROUP_INTERVAL:-1m}
            repeat_interval: ${ALERTMANAGER_EVENT_REPEAT_INTERVAL:-24h}
          - receiver: operator-email
            matchers: ['severity="critical"']
            group_wait: ${ALERTMANAGER_CRITICAL_GROUP_WAIT:-10s}
            repeat_interval: ${ALERTMANAGER_CRITICAL_REPEAT_INTERVAL:-1h}
          - receiver: operator-email
            matchers: ['severity="warning"']
            repeat_interval: ${ALERTMANAGER_WARNING_REPEAT_INTERVAL:-12h}

      inhibit_rules:
        - source_matchers: ['alertname="CollectorUnavailable"']
          target_matchers: ['scope="worker"']
          equal: [service]

      receivers:
        - name: operator-email
          email_configs:
            - to: "${ALERTMANAGER_OPERATOR_EMAIL:-}"
              send_resolved: true
              html: ""
              headers:
                Subject: '[{{ .Status }}] The Network {{ .CommonLabels.alertname }}'
              text: |-
                Status: {{ .Status }}
                {{ range .Alerts -}}
                Alert: {{ .Labels.alertname }}
                Severity: {{ .Labels.severity }}
                Action: {{ .Labels.action }}
                Reason: {{ .Labels.reason }}
                Summary: {{ .Annotations.summary }}
                Runbook: {{ .Annotations.runbook }}
                {{ end }}
