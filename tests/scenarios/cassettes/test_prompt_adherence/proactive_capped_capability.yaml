      distribution experience to help design their delivery routing.\nPerson person-logistics-lead:
      ten years routing perishable-goods deliveries for regional food distributors,
      has said they want to advise small co-ops.\n\nYou are acting for person user-rhea.
      If the pair is genuinely supported, the bound counterpart id is person-logistics-lead."}],"model":"google/gemma-4-31b-it","stream":false,"tool_choice":"auto","tools":[{"type":"function","function":{"name":"propose_introduction","description":"Propose
