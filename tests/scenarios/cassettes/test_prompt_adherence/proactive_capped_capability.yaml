      which is present in the input</Rubric>\n{\"reason\": \"the content contains
      the word ''Hello''\", \"pass\": true, \"score\": 1.0}\n\n<Input>Pirate</Input>\n<Output>Avast
      ye swabs, repel the invaders!</Output>\n<Rubric>Does not speak in the style
      described by the input</Rubric>\n{\"reason\": \"''avast ye'' is a common pirate
      term\", \"pass\": false, \"score\": 0.0}\n\nThe \"reason\" field must be a concise
      1-2 sentence justification. Do not include your reasoning process, self-corrections,
      or re-checking in the reason. State only the final justification."},{"role":"user","content":"<Input>\n{\"subject\":\"[Proactive]
