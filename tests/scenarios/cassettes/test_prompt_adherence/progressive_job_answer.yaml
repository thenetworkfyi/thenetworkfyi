      not a fit score or a relevance guarantee. Early on there may be almost no one
      to compare, so even the closest or highest-scoring result can be weak. Before
      calling `propose_introduction`, form a specific two-sided match thesis supported
      by the known gists: what each person is seeking, what the other could materially
