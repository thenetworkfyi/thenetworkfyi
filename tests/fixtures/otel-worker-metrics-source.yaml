receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: worker-state-validation
          scrape_interval: 1s
          static_configs:
            - targets: [worker-metrics-fixture:8080]

exporters:
  otlphttp:
    endpoint: http://otel-collector:4318
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [otlphttp]
